name: genui_mock
description: >-
  Record, save, and replay A2UI streaming sessions as deterministic,
  git-diffable JSON fixtures. Test catalog widgets against real recorded
  model output with zero network calls.
version: 0.1.3
homepage: https://github.com/NJashwanth/genui_mock
repository: https://github.com/NJashwanth/genui_mock
issue_tracker: https://github.com/NJashwanth/genui_mock/issues
topics:
  - a2ui
  - testing
  - mocking
  - fixtures

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.35.7"

dependencies:
  flutter:
    sdk: flutter
  a2ui_core: ^0.6.0

dev_dependencies:
  a2ui_flutter: ^0.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
