name: genui_mock
description: >-
  Record, save, and replay GenUI streaming sessions as deterministic,
  git-diffable JSON fixtures. Test Catalog widgets against real recorded
  model output with zero network calls.
version: 0.1.2
homepage: https://github.com/NJashwanth/genui_mock
repository: https://github.com/NJashwanth/genui_mock
issue_tracker: https://github.com/NJashwanth/genui_mock/issues
topics:
  - genui
  - testing
  - mocking
  - fixtures

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.35.7"

dependencies:
  flutter:
    sdk: flutter
  genui: ^0.10.2
  a2ui_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
