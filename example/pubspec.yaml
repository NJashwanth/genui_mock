version: 1.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  a2ui_core: ^0.6.0
  a2ui_flutter: ^0.2.0
  genui_mock:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
